[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "smart-travel-agent"
version = "0.1.0"
description = "A production-minded travel assistant built with MCP, LangChain and LangGraph"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "httpx>=0.27,<1",
  "mcp>=1.10,<2",
  "pydantic>=2.8,<3",
  "pydantic-settings>=2.4,<3",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3,<9",
  "pytest-asyncio>=0.24,<1",
  "respx>=0.21,<1",
  "ruff>=0.9,<1",
]
agent = [
  "langchain>=1.3,<2",
  "langchain-mcp-adapters>=0.3,<1",
  "langchain-openai>=1.3,<2",
  "langgraph>=1.2,<2",
  "langgraph-checkpoint-sqlite>=3.0.1,<4",
]
api = [
  "fastapi>=0.115,<1",
  "uvicorn[standard]>=0.34,<1",
]

[project.scripts]
travel-weather-server = "travel_agent.mcp_servers.weather_server:main"

[tool.hatch.build.targets.wheel]
packages = ["src/travel_agent"]

[tool.pytest.ini_options]
addopts = "-q"
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC"]
